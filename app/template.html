<title>Bombtrack Knowledge & Advice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/*__FONTS__*/
/* Layout: app shell like the live Bombtrack assistant. Sidebar (navigation + chat archive) left, one working view right. Warm grey shell, white cards, lime action colour. */
:root{
  --page:#faf9f6; --panel:#f0efe9; --card:#ffffff; --line:#e4e3dc; --hover:#e7e7e3; --ink:#191d1c; --muted:#6f716b;
  --lime:#8aa3bc; --lime-ink:#141c25; --lime-soft:#e6edf3; --lime-deep:#3a5570; --warn:#b5541f; --ok:#3f8a52; --ghost:#3c79c9;
  --display:"Archivo","Inter",Arial,sans-serif; --body:"Inter",Arial,Helvetica,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#151716; --panel:#1c1f1d; --card:#222624; --line:#2e332f; --hover:#2a2d31; --ink:#ecefe9; --muted:#a2a69e;
  --lime:#8aa3bc; --lime-ink:#0e1620; --lime-soft:#222a33; --lime-deep:#a9bccd; --warn:#f08a4b; --ok:#7cc48e; --ghost:#7fb0f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#151716; --panel:#1c1f1d; --card:#222624; --line:#2e332f; --hover:#2a2d31; --ink:#ecefe9; --muted:#a2a69e;
  --lime:#8aa3bc; --lime-ink:#0e1620; --lime-soft:#222a33; --lime-deep:#a9bccd; --warn:#f08a4b; --ok:#7cc48e; --ghost:#7fb0f0; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.muted{color:var(--muted)}
a{color:var(--ink);text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
a.btn,a.card{color:var(--ink)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* shell */
.shell{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto;
  padding-block:0 14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;gap:6px}
.brand{display:flex;align-items:center;height:76px;padding:0 6px;flex:none}
.sideclose{display:none;margin-left:auto;width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;font-size:16px}
.scrim{display:none}
.brand{justify-content:space-between}
.brand b{font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:17px}
.brand span{display:none}
.newchat{display:flex;align-items:center;gap:10px;border:0;background:var(--ink);color:var(--page);border-radius:12px;padding:13px 16px;cursor:pointer;font-weight:500;font-size:14px;margin-bottom:8px;flex:none}
.newchat:hover{opacity:.9}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font-family:var(--display);font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);padding:22px 12px 8px;margin-top:10px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.nav .grp::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--lime);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.nav .grp:first-child{border-top:0;margin-top:0;padding-top:8px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:0 12px 0 28px;height:36px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:400;color:color-mix(in srgb,var(--ink) 72%,transparent)}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--hover);font-weight:600;color:var(--ink)}
.nav .ic{width:18px;text-align:center;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;background:#d23f31;color:#fff;border-radius:999px;padding:0 7px;line-height:18px;min-width:18px;text-align:center}
.nav .badge{margin-left:auto}
.hist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.hist button{border:0;background:transparent;text-align:left;padding:6px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist button:hover,.hist button[aria-current="true"]{background:var(--hover)}
.hist{flex:none;max-height:none;overflow:visible}
.hist .allchats{color:var(--muted);font-size:13px;font-weight:500}
.arch h3{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 2px 8px;font-family:var(--body)}
.arch .card{display:flex;flex-direction:column;overflow:hidden}
.arch button{display:grid;gap:2px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 18px;cursor:pointer}
.arch button:last-child{border-bottom:0}
.arch button:hover{background:var(--hover)}
.arch .at{font-weight:600}
.arch .ap{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch .am{font-size:12px;color:var(--muted)}
.sidefoot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 4px}
.seg{display:inline-flex;border:0;border-radius:12px;overflow:hidden;background:var(--lime-soft);padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;border-radius:9px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:14px;height:76px;flex:none;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--page)}
.topbar .tb-brand{display:none;font-family:var(--display);font-weight:700;letter-spacing:.2em;font-size:14px}
.topbar .tb-title{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.topbar .tb-title strong{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .tb-title small{font-size:12px;color:var(--muted)}
.topbar .tb-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.gear{width:40px;height:40px;border:0;background:var(--lime-soft);border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.gear:hover{border-color:var(--ink)}
.gear[hidden]{display:none}
.gear{position:relative}.gear.on{background:var(--lime);color:var(--lime-ink)}
.gear[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:#d23f31;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.setgrp{font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:8px 2px -8px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.prow b{font-family:var(--display);font-size:16px}
.seg.big button{padding:8px 14px;font-size:13px}
.toolbar .yearsel{width:auto;flex:none;font-weight:600;padding:9px 44px 9px 14px;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%278%27 viewBox=%270 0 12 8%27%3E%3Cpath d=%27M1 1.5l5 5 5-5%27 fill=%27none%27 stroke=%27%23777%27 stroke-width=%271.8%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 16px center;cursor:pointer}
.fpanel{padding:20px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px 28px}
.fgrp{display:flex;flex-direction:column;gap:10px}
.fgrp .chips,.factive{gap:10px}
.fgrp .chip:disabled{opacity:.4;cursor:default}
.factive{align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);margin-right:2px}
.btn .cnt{background:var(--lime);color:var(--lime-ink);border-radius:999px;padding:0 7px;font-size:11px;font-weight:700;margin-left:4px}
.stylebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.styleintro{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.styleintro h2{font-size:24px}
.styleintro .lead{margin:0;font-size:16px;max-width:75ch}
.myrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mybadge{font-weight:600;color:var(--warn)}
.catbar{margin-bottom:-4px}
.anbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.angrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.anstage{padding:10px;background:#fff}
.ansvg{width:100%;height:auto;display:block}
.anfr{stroke:#2b2f2d;stroke-width:16;fill:none;stroke-linecap:round;stroke-linejoin:round}
.anpart{stroke:#8a8e88;stroke-width:12;fill:none;stroke-linecap:round}
.anwh{stroke:#e2e2da;stroke-width:24;fill:none}
.anrot{stroke:#cfd0c8;stroke-width:6;fill:none}
.anring{stroke:#8a8e88;stroke-width:8;fill:none}
.anhs{cursor:pointer}
.anhs circle{fill:var(--lime);stroke:#fff;stroke-width:4}
.anhs text{font:700 36px var(--body);fill:#fff;pointer-events:none}
.anhs:hover circle{fill:#fff}
.anhs.on circle{fill:#1d2a20;stroke:var(--lime);stroke-width:6}
.anhs.on text{fill:#fff}
.anhs.on circle{animation:anp 1.6s ease-in-out infinite}
@keyframes anp{50%{stroke-width:14}}
.aninfo{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.aninfo h2{font-size:22px}
.aninfo p{margin:0}
.andl{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
.andl dt{color:var(--muted)}.andl dd{margin:0;font-weight:600}
@media (max-width:900px){.angrid{grid-template-columns:minmax(0,1fr)}}
.arch2{display:flex;flex-direction:column;overflow:hidden}
.arch2 button{display:grid;gap:3px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 18px;cursor:pointer}
.arch2 button:last-child{border-bottom:0}
.arch2 button:hover{background:var(--hover)}
.arch2 .at{font-weight:600}.arch2 .am{font-size:12.5px;color:var(--muted)}
.arch2 .ok{color:var(--ok)}
.cul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin-bottom:-6px}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:3px;font-size:13px}
.crumbs button:hover{text-decoration-color:currentColor}
.crumbs [aria-current]{color:var(--muted)}
.crumbs .sep{opacity:.6}
.atabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px}
.atabs button{border:0;background:none;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;color:var(--muted)}
.atabs button:hover{color:var(--ink)}
.atabs button[aria-current="page"]{background:var(--hover);color:var(--ink);font-weight:600}
.upl{display:grid;gap:14px;padding:20px}
.upl .row2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:12px}
.upl label{display:grid;gap:6px;font-size:13px;font-weight:500}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:var(--page)}
.drop.over,.drop:hover{border-color:var(--ink);color:var(--ink)}
.prog{height:6px;border-radius:3px;background:var(--panel);overflow:hidden}.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .2s}
@media (max-width:700px){.upl .row2{grid-template-columns:minmax(0,1fr)}}
.iconbtn{border:0;background:var(--lime-soft);border-radius:10px;padding:6px 10px;cursor:pointer;display:none}
.view{flex:1;min-height:0;overflow-y:auto;padding-block:44px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.vhead{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.vhead h1{font-size:clamp(26px,3.4vw,38px);font-weight:800}
.vhead p{margin:0;color:var(--muted);max-width:68ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.btn{border:0;background:var(--lime-soft);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:color-mix(in srgb,var(--lime) 22%,var(--lime-soft))}
.btn.primary:hover,.btn.dark:hover{filter:brightness(1.08)}
.btn.primary{background:var(--lime);color:var(--lime-ink)}
.btn.dark{background:var(--lime);color:var(--lime-ink)}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--lime-soft);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.chip:hover{background:color-mix(in srgb,var(--lime) 22%,var(--lime-soft))}
.chip[aria-pressed="true"],.chip.on{background:var(--lime);color:var(--lime-ink)}
.chip[aria-pressed="true"] .muted,.chip.on .muted{color:color-mix(in srgb,var(--lime-ink) 75%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.field{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;width:100%}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}

/* chat */
.chatview{display:flex;flex-direction:column;min-height:0;height:100%}
.chatview.start{justify-content:center;padding-bottom:8vh}
.chatview.start .chatlog{flex:0 1 auto;padding-bottom:8px}
.chatview.start .hello{padding-top:0}
.chatlog{flex:1;min-height:0;overflow-y:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chatcol{max-width:780px;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.hello{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:6vh}
.hello h1{font-size:clamp(28px,4vw,40px);font-weight:800}
.hello p{margin:0;color:var(--muted);max-width:52ch}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:700px;text-align:left}
.sugg button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14px}
.sugg button:hover{border-color:var(--ink)}
.msg{min-width:0}
.msg.u{align-self:flex-end;background:var(--lime-soft);color:var(--ink);border:0;padding:12px 18px;border-radius:22px;max-width:80%;white-space:pre-wrap;font-size:15.5px}
.msg.a{align-self:stretch}
.msg.a .who{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.answer{overflow-wrap:anywhere}
.answer p{margin:0 0 .65em}
.answer ul,.answer ol{margin:0 0 .65em;padding-left:1.3em}
.answer h4{font-family:var(--display);font-size:17px;margin:.7em 0 .3em}
.answer code{font-family:var(--mono);font-size:.88em;background:var(--panel);padding:1px 5px;border-radius:4px}
.answer a{color:inherit;text-decoration:underline;text-decoration-color:var(--muted)}
.tw{overflow-x:auto;margin:.4em 0 .8em;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tw table{border-collapse:collapse;font-size:13.5px;min-width:100%}
.tw th,.tw td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
.tw th{font-family:var(--display);font-weight:700;background:var(--panel)}
.tw tr:last-child td{border-bottom:0}
.thinking{color:var(--muted)}
.thinking::after{content:"";display:inline-block;width:6px;height:6px;margin-left:6px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
.srcs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.srcs button{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--muted)}
.srcs button:hover{color:var(--ink);border-color:var(--ink)}
.acts{display:flex;gap:6px;margin-top:6px;align-items:center}
.acts button{border:1px solid transparent;background:transparent;border-radius:8px;padding:2px 7px;cursor:pointer;color:var(--muted);font-size:13px}
.acts button:hover{border-color:var(--line);color:var(--ink)}
.acts .flag{font-size:12px;color:var(--warn)}
.composer{padding-block:10px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.composer form{max-width:780px;margin-inline:auto;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 10px 8px 14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 30px rgba(25,29,28,.06)}
.composer textarea{border:0;background:transparent;resize:none;outline:none;min-height:24px;max-height:180px}
.composer .row{display:flex;align-items:center;gap:8px}
.composer .row .sp{flex:1}
.send{width:36px;height:36px;border-radius:11px;border:0;background:var(--lime);color:var(--lime-ink);font-weight:800;cursor:pointer;font-size:16px}
.send:disabled{opacity:.45;cursor:default}
.stop{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:13px}
.status{max-width:780px;margin:4px auto 0;font-size:12px;color:var(--muted);min-height:1em}

/* products */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .field{max-width:320px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pc{display:flex;flex-direction:column;gap:6px;padding:12px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r)}
.pc:hover{border-color:var(--ink)}
.pc .art{aspect-ratio:16/9;border-radius:10px;background:var(--panel);display:grid;place-items:center;overflow:hidden;max-width:100%}
.pc .art svg{width:94%;height:auto}
.pc .art .code{font-family:var(--mono);font-size:13px;color:var(--muted);padding:8px;text-align:center}
.pc b{font-family:var(--display);font-size:16px;line-height:1.2}
.pc .meta{font-size:12.5px;color:var(--muted)}
.pc .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots span{font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
.dots span.on{background:var(--lime-soft);border-color:transparent}
.dots span.off{color:var(--muted);text-decoration:line-through}

/* detail */
.dhead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.dhead .art{background:var(--panel);border-radius:var(--r);padding:12px}
.dhead .art svg{width:100%;height:auto}
.dtitle{display:flex;flex-direction:column;gap:10px}
.dtitle h1{font-size:clamp(28px,4vw,42px);font-weight:800}
.dtitle .desc{color:var(--muted);margin:0;max-width:62ch}
.specs{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.specs .sgrp{padding:0;border:0;border-radius:0;background:none;box-shadow:none}
.specs .sgrp h3{margin:0;padding:10px 18px;background:var(--panel);border-block:1px solid var(--line);font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.specs .sgrp:first-child h3{border-top:0}

/* ---------------- search index ---------------- */
function flatText(p, lg){
  const x = p[lg]; if (!x) return "";
  const parts = [x.d||""];
  for (const grp of [x.s, x.x]) for (const s in grp||{}) for (const k in grp[s]) parts.push(k+" "+grp[s][k]);
  return parts.join(" ");
}
const IDX = Object.fromEntries(P.map(p => [p.h, (p.t+" "+p.cat+" "+(p.fam||"")+" "+p.h+" "+flatText(p,"en")+" "+flatText(p,"de")).toLowerCase()]));
function searchProducts(q, kind, n=12){
  const toks = q.toLowerCase().split(/[^\p{L}\p{N}+.\-]+/u).filter(w=>w.length>1);
  if (!toks.length) return [];
  const res=[];
  for (const p of P){
    if (kind && p.k!==kind) continue;
    const ti=p.t.toLowerCase(); let s=0;
    for (const w of toks){ if (ti.includes(w)) s+=6; if (IDX[p.h].includes(w)) s+=1; }
    if (s>0) res.push([s,p]);
  }
  return res.sort((a,b)=>b[0]-a[0]).slice(0,n).map(r=>r[1]);
}
function mentioned(text){
  const tl=" "+text.toLowerCase()+" ";
  return P.filter(p=>p.k==="bike"||p.k==="frameset").filter(p=>tl.includes(" "+p.t.toLowerCase().replace(/ frameset$| frame$/,"")+" ")||tl.includes(p.t.toLowerCase()));
}

function searchDocs(q, n=4){
  const toks=q.toLowerCase().split(/[^\p{L}\p{N}\-]+/u).filter(w=>w.length>2);
  if(!toks.length) return [];
  const years=(q.match(/\b(20[12]\d)\b/g)||[]).map(Number).concat((q.match(/\bMY ?(\d\d)\b/gi)||[]).map(m=>2000+Number(m.replace(/\D/g,""))));
  const sc=(l,c)=>toks.reduce((a,w)=>a+(l.split(w).length-1),0)+(c.year&&years.includes(c.year)?3:0);
  return [...DOCS.chunks.map((c,i)=>[sc(CIDX[i],c),c]),...UPC.map(c=>[sc(c.l,c),c])].filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
}

  if (x.d) s += `Description: ${x.d.slice(0,900)}\n`;
  for (const grp of [x.s, x.x]) for (const sec in grp||{}) s += `${sec}: ` + Object.entries(grp[sec]).map(([k,v])=>`${k}: ${v}`).join("; ") + "\n";

/* ---------------- markdown ---------------- */
function md(src){
  const lines=esc(src).split("\n"); let out="",i=0;
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https:\/\/bombtrack\.com[^)\s]*)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])&&lines[i+1].includes("-")){
      const row=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inl(c.trim()));
      const h=row(l); i+=2; let b="";
      while(i<lines.length&&/^\s*\|/.test(lines[i])){ b+="<tr>"+row(lines[i]).map(c=>`<td>${c}</td>`).join("")+"</tr>"; i++; }
      out+=`<div class="tw"><table><thead><tr>${h.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${b}</tbody></table></div>`; continue;
    }
    if(/^#{1,4}\s/.test(l)){ out+=`<h4>${inl(l.replace(/^#+\s/,""))}</h4>`; i++; continue; }
    if(/^\s*[-*•]\s+/.test(l)){ let li=""; while(i<lines.length&&/^\s*[-*•]\s+/.test(lines[i])){ li+=`<li>${inl(lines[i].replace(/^\s*[-*•]\s+/,""))}</li>`; i++; } out+=`<ul>${li}</ul>`; continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ let li=""; while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){ li+=`<li>${inl(lines[i].replace(/^\s*\d+[.)]\s+/,""))}</li>`; i++; } out+=`<ol>${li}</ol>`; continue; }
    if(!l.trim()){ i++; continue; }
    const p=[]; while(i<lines.length&&lines[i].trim()&&!/^(#{1,4}\s|\s*[-*•]\s+|\s*\d+[.)]\s+|\s*\|)/.test(lines[i])){ p.push(inl(lines[i])); i++; }
    if(p.length) out+=`<p>${p.join("<br>")}</p>`; else { out+=`<p>${inl(l)}</p>`; i++; }
  }
  return out;
}

let pdfLib=null;
async function loadPdf(){
  if(pdfLib) return pdfLib;
  await new Promise((res,rej)=>{const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc);});
  const lib=window.pdfjsLib;
  try{ const w=await fetch("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js").then(r=>r.text()); lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([w],{type:"text/javascript"})); }
  catch{ lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
  return pdfLib=lib;
}
async function fileToPages(f, onp){
  if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){
    const lib=await loadPdf(); const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise; const out=[];
    for(let i=1;i<=doc.numPages;i++){ const pg=await doc.getPage(i); const tc=await pg.getTextContent(); let line="",y=null,txt="";
      for(const it of tc.items){ const yy=Math.round(it.transform[5]); if(y!==null&&Math.abs(yy-y)>2){ txt+=line.trim()+"\n"; line=""; } line+=it.str+(it.hasEOL?"":" "); y=yy; }
      txt+=line.trim(); out.push(txt.replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()); onp&&onp(i/doc.numPages*.5); }
    return out;
  }
  const txt=await f.text(); const out=[]; for(let i=0;i<txt.length;i+=3500) out.push(txt.slice(i,i+3500)); return out;
}

const KEYRX=/^(frame|rahmen|fork|gabel|cassette|kassette|chainring|kettenblatt|shifters?|schalthebel|rear derailleur|schaltwerk|brakes|bremsen|front tire|vorderreifen|complete weight|gesamtgewicht|komplettgewicht|maximum rider weight|maximales fahrergewicht|rack|gepäckträger|light|beleuchtung|frame max tire clearance.*|maximale reifenfreiheit rahmen.*)$/i;

const clean=v=>v==null?v:String(v).replace(/\s*\|\s*$/,"");
function cmpRows(ps){
  const out=[];
  if(SET.price) out.push({sec:"",label:lang==="de"?"Preis":"Price",vals:ps.map(p=>eur(priceOf(p))),key:true});
  out.push({sec:"",label:t("sizes"),vals:ps.map(p=>sizeList(p).map(x=>x[0]).join(", ")||"–"),key:true});
  const secs=[]; const seen=new Set();
  ps.forEach(p=>{const x=L(p); for(const grp of [x.s,x.x]) for(const s2 in grp||{}) if(!seen.has(s2)){seen.add(s2);secs.push(s2);} });
  for(const s2 of secs){
    const labels=[]; const ls=new Set();
    ps.forEach(p=>{const x=L(p); const o=(x.s&&x.s[s2])||(x.x&&x.x[s2])||{}; for(const k in o) if(!ls.has(k)&&!k.startsWith("_")){ls.add(k);labels.push(k);} });
    for(const k of labels) out.push({sec:s2,label:k,vals:ps.map(p=>{const x=L(p); const o=(x.s&&x.s[s2])||(x.x&&x.x[s2])||{}; return clean(o[k])??"–";}),key:KEYRX.test(k.replace(/[\s|]+/g," ").trim())});
  }
  if(ps.some(p=>p.g)){
    const keys=[...new Set(ps.flatMap(p=>p.g?Object.keys(G[p.g].rows):[]))];
    for(const k of keys) out.push({sec:t("geoTitle")+" (M)",label:geoLabel(k),vals:ps.map(p=>{ if(!p.g) return "–"; const g=G[p.g]; const r=g.rows[k]; return r? r[sizeIdx(g)]+` (${g.sizes[sizeIdx(g)]})` :"–";}),key:GEOKEY.includes(k),geo:true});
  }

  return out;
}

const GEO_INFO = {
  "STACK":{de:"Stack",en:"Stack",d:{en:"Vertical distance from the bottom bracket centre to the top of the head tube. More stack means a more upright, relaxed position.",de:"Senkrechter Abstand von der Tretlagermitte zur Oberkante des Steuerrohrs. Mehr Stack bedeutet eine aufrechtere, entspanntere Sitzposition."}},
  "REACH":{de:"Reach",en:"Reach",d:{en:"Horizontal distance from the bottom bracket centre to the top of the head tube. More reach means a longer, more stretched position.",de:"Waagerechter Abstand von der Tretlagermitte zur Oberkante des Steuerrohrs. Mehr Reach bedeutet eine längere, gestrecktere Haltung."}},
  "HEAD ANGLE":{de:"Lenkwinkel",en:"Head angle",d:{en:"Angle of the head tube to the ground. Steeper (higher number) steers quicker. Slacker steers calmer and feels safer on fast or rough descents.",de:"Winkel des Steuerrohrs zum Boden. Steiler (höhere Zahl) lenkt direkter. Flacher lenkt ruhiger und gibt mehr Sicherheit bei schnellen oder ruppigen Abfahrten."}},
  "SEAT ANGLE":{de:"Sitzwinkel",en:"Seat angle",d:{en:"Angle of the seat tube to the ground. Steeper puts the rider further forward over the pedals, which helps climbing and an efficient pedal stroke.",de:"Winkel des Sitzrohrs zum Boden. Steiler bringt die Fahrerin oder den Fahrer weiter nach vorn über die Pedale, das hilft beim Klettern und beim effizienten Treten."}},
  "SEAT ANGLE EFFECTIVE":{de:"Sitzwinkel (effektiv)",en:"Seat angle (effective)",d:{en:"Effective seat angle at a typical saddle height, used when the seat tube is offset or bent.",de:"Effektiver Sitzwinkel bei typischer Sattelhöhe, wichtig wenn das Sitzrohr versetzt oder gebogen ist."}},
  "CHAINSTAY LENGTH":{de:"Kettenstrebenlänge",en:"Chainstay length",d:{en:"From the bottom bracket to the rear axle. Short is lively and agile. Long is calmer, climbs steadier and leaves more heel room for rear panniers.",de:"Von der Tretlagermitte bis zur Hinterachse. Kurz fährt sich lebendig und wendig. Lang ist ruhiger, klettert stabiler und lässt mehr Fersenfreiheit für Hinterradtaschen."}},
  "WHEELBASE LENGTH":{de:"Radstand",en:"Wheelbase",d:{en:"Distance between the two axles. Long is stable at speed and with luggage. Short turns tighter and feels nimble.",de:"Abstand zwischen den beiden Achsen. Lang ist stabil bei Tempo und mit Gepäck. Kurz lenkt enger und fühlt sich wendig an."}},
  "BB DROP":{de:"Tretlagerabsenkung (BB Drop)",en:"BB drop",d:{en:"How far the bottom bracket sits below the axle line. More drop means a lower centre of gravity and a planted feel. Less drop gives more pedal clearance off-road.",de:"Wie weit das Tretlager unter der Achslinie liegt. Mehr Absenkung bedeutet einen tieferen Schwerpunkt und ein satteres Fahrgefühl. Weniger gibt mehr Pedalfreiheit im Gelände."}},
  "TRAIL":{de:"Nachlauf",en:"Trail",d:{en:"Results from head angle, fork offset and wheel size. More trail feels stable and tracks straight. Less trail steers lighter, which suits front loads like a handlebar bag or front rack.",de:"Ergibt sich aus Lenkwinkel, Gabelvorbiegung und Laufradgröße. Mehr Nachlauf fühlt sich stabil an und läuft geradeaus. Weniger lenkt leichter, das passt zu Frontlast wie Lenkertasche oder Frontträger."}},
  "HEADTUBE LENGTH":{de:"Steuerrohrlänge",en:"Head tube length",d:{en:"A longer head tube raises the handlebar and adds stack.",de:"Ein längeres Steuerrohr bringt den Lenker höher und erhöht den Stack."}},
  "SEAT TUBE LENGTH":{de:"Sitzrohrlänge",en:"Seat tube length",d:{en:"From the bottom bracket centre to the top of the seat tube. It sets standover and how far the seatpost can go in.",de:"Von der Tretlagermitte bis zur Oberkante des Sitzrohrs. Bestimmt die Überstandshöhe und wie weit die Sattelstütze einstecken kann."}},
  "HORIZONTAL TT LENGTH":{de:"Oberrohrlänge horizontal",en:"Top tube (horizontal)",d:{en:"Top tube length measured level. A classic way to compare sizes, though reach and stack say more about fit.",de:"Oberrohrlänge waagerecht gemessen. Klassischer Größenvergleich, Reach und Stack sagen aber mehr über die Passform."}},
  "STANDOVER":{de:"Überstandshöhe",en:"Standover",d:{en:"Height of the top tube above the ground. Important for shorter riders and for getting on and off with luggage.",de:"Höhe des Oberrohrs über dem Boden. Wichtig für kleinere Personen und fürs Auf- und Absteigen mit Gepäck."}},
  "FRONT CENTER":{de:"Front Center",en:"Front center",d:{en:"From the bottom bracket centre to the front axle. Longer is more stable and reduces toe overlap with the front wheel or fender.",de:"Von der Tretlagermitte zur Vorderachse. Länger ist stabiler und verringert Fußüberschneidung mit Vorderrad oder Schutzblech."}},
  "FORK OFFSET":{de:"Gabelvorbiegung (Offset)",en:"Fork offset",d:{en:"How far the front axle sits ahead of the steering axis. Together with the head angle it sets the trail.",de:"Wie weit die Vorderachse vor der Lenkachse liegt. Bestimmt zusammen mit dem Lenkwinkel den Nachlauf."}},

  "WHEEL SIZE":{de:"Laufradgröße",en:"Wheel size",d:{en:"Smaller frames often use 650B (27.5\") so that proportions and toe clearance work. Larger sizes use 700C (29\").",de:"Kleine Rahmen nutzen oft 650B (27,5\"), damit Proportionen und Fußfreiheit passen. Größere nutzen 700C (29\")."}},
  "MINIMUM RIDER HEIGHT":{de:"Körpergröße min.",en:"Rider height min.",d:{en:"Bombtrack's rough size guideline by body height, in mm. A fitting at a dealer is always more accurate.",de:"Bombtracks grobe Größenempfehlung nach Körpergröße, in mm. Eine Beratung beim Händler ist immer genauer."}},
  "MAXIMUM RIDER HEIGHT":{de:"Körpergröße max.",en:"Rider height max.",d:{en:"Upper end of Bombtrack's size guideline, in mm.",de:"Obere Grenze von Bombtracks Größenempfehlung, in mm."}},
  "SEAT TUBE OFFSET":{de:"Sitzrohr-Versatz",en:"Seat tube offset",d:{en:"How far the seat tube is offset from the bottom bracket.",de:"Wie weit das Sitzrohr gegenüber dem Tretlager versetzt ist."}}

  const Y=y=>-y, f=n=>n.toFixed(0), L2=(a,b,c="")=>`<line class="dim dimline" x1="${a.x}" y1="${Y(a.y)}" x2="${b.x}" y2="${Y(b.y)}" ${c}/>`;

function inGroup(size, lab){ if(!lab) return true; const [a,b]=lab.split("-"); const i=SZ.indexOf(size), ia=SZ.indexOf(a), ib=SZ.indexOf(b||a); return i>=ia&&i<=ib; }

/* ---- gearing ---- */
let gr={sel:["bombtrack-arise-tour","bombtrack-hook-ext-rival","bombtrack-audax-al-road"],cad:90,size:"M",custom:{rings:"40",cogs:"11-42",tire:"45",bead:622,on:false}};
function gearOf(p){
  const d=TD[p.h]; if(!d||!d.rings.length||!d.cogs) return null;
  const tg=pickGroup(d.rtires.length?d.rtires:d.tires,gr.size); const tr=tg?.t?.[0]; if(!tr) return null;
  return {name:p.t,rings:d.rings,cogs:d.cogs,speeds:d.speeds,w:tr[0],b:tr[1]};
}
function gearCalc(g){
  const C=circ(g.w,g.b), D=(g.b+2*g.w)/25.4;
  const lo=Math.min(...g.rings)/g.cogs[1], hi=Math.max(...g.rings)/g.cogs[0];
  return {lo,hi,loGI:lo*D,hiGI:hi*D,loDev:lo*C/1000,hiDev:hi*C/1000,vmax:hi*C/1000*gr.cad*60/1000,vmin:lo*C/1000*gr.cad*60/1000,range:hi/lo*100};
}

  const calc=list.map(([p,g])=>[p,g,gearCalc(g)]);

     <div style="position:relative;height:22px;background:var(--panel);border-radius:6px"><div style="position:absolute;left:${X(c.loGI)}%;width:${X(c.hiGI)-X(c.loGI)}%;top:0;bottom:0;background:var(--lime);border-radius:6px"></div>

function clearFor(groups, size, bead){ const g=pickGroup(groups,size); const m=(g?.t||[]).filter(x=>x[1]===bead).map(x=>x[0]); return m.length?Math.max(...m):null; }

/* ---- spoke calculator (general) ---- */
const nums = s => (String(s).replace(/,/g,".").match(/\d+(?:\.\d+)?/g)||[]).map(Number);
function wheelsOf(p){ const w=(p.en&&p.en.x&&p.en.x.Wheels)||{}; const o={}; for(const k in w) o[k.replace(/[\s|]+/g," ").replace("flangedistance","flange distance")]=w[k]; return o; }
function groupsOf(s){ return String(s||"").split("|").map(part=>{ const m=part.trim().match(/^([A-Z]{1,3}(?:\s*-\s*[A-Z]{1,3})?)?\s*(.*)$/); return {lab:(m[1]||"").replace(/\s/g,""), v:nums(m[2])}; }).filter(g=>g.v.length); }
const SPK_BIKES = P.filter(p=>p.k==="bike"&&wheelsOf(p).ERD);
let sp={h:"", end:"rear", gi:null, erd:604, n:32, xL:3, xR:3, pcdL:58, pcdR:58, dL:34.3, dR:16.7, cc:51, off:8.8, ocr:0, hole:2.4, pub:[]};
function spokeLen(erd,pcd,d,n,x,hole){ const a=(720*x/n)*Math.PI/180, r1=erd/2, r2=pcd/2; return Math.sqrt(d*d+r1*r1+r2*r2-2*r1*r2*Math.cos(a))-hole/2; }
function spPrefill(){
  const p=byH[sp.h]; if(!p) return; const w=wheelsOf(p); const E=sp.end==="front";
  const erdG=groupsOf(w.ERD); if(sp.gi==null||sp.gi>=erdG.length) sp.gi=erdG.length>1?erdG.length-1:0;
  const g=erdG[sp.gi]; sp.erd=g?g.v[0]:sp.erd;

Most asked products: ${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([h,c])=>(byH[h]?.t||h)+" ("+c+")").join(", ")}
Open questions (count, status): ${opn.slice(0,60).map(o=>`"${o.q}" (${o.count||1}x, ${o.status})`).join("; ")}
All questions this month: ${Q.slice(0,300).map(q=>`[${q.status}] ${q.q}`).join(" | ")}`;
  const prompt=`Write the monthly report of the Bombtrack Knowledge & Advice assistant for the Bombtrack team, in ${lang==="de"?"German":"English"}, no em-dashes, Markdown. Use only the data below. Sections: 1) Summary in 3 sentences with the key numbers, 2) What dealers and staff asked about most (themes, not a list of every question), 3) Gaps: questions the knowledge base could not answer, grouped, with how often, 4) Product insight: confusion or recurring issues per product worth passing to product or marketing, 5) Next steps: 3 to 5 concrete actions (e.g. answer these open questions, fix this data, add this document). Keep it to one page.

DATA:
${data}`;
  try{ const {text}=await ai("report",prompt,{cache:false}); rp.text=text; }catch(e){ rp.text=ERR[e.code]||"The report couldn't be created. Try again."; }
  rp.busy=false; if(route.v==="stats") render();
}

function viewSettings(v){
  v.style.padding="";
  const seg=(id,items,cur)=>`<div class="seg big" id="${id}">${items.map(([v,l])=>`<button data-x="${v}" aria-pressed="${cur===v}">${esc(l)}</button>`).join("")}</div>`;
  const personal=`<section class="card" style="padding:18px 20px;display:grid;gap:16px">
      <div class="prow"><span><b>${esc(t("setLang"))}</b><br><span class="note">${esc(t("setLangSub"))}</span></span>${seg("pLang",[["de","Deutsch"],["en","English"]],lang)}</div>
      <div class="prow"><span><b>${esc(t("setTheme"))}</b><br><span class="note">${esc(t("setThemeSub"))}</span></span>${seg("pTheme",[["light",t("thLight")],["auto",t("thAuto")],["dark",t("thDark")]],theme)}</div></section>`;
  const row=(k,lab,sub)=>`<label class="card" style="padding:14px 16px;display:flex;gap:14px;align-items:center;cursor:pointer"><input type="checkbox" id="set_${k}" ${SET[k]?"checked":""} style="width:22px;height:22px;accent-color:var(--ink)"><span style="flex:1"><b style="font-family:var(--display);font-size:16px">${esc(lab)}</b><br><span class="note">${esc(sub)}</span></span></label>`;
  v.innerHTML=`<div class="wrap" style="max-width:720px"><div class="vhead"><h1>${esc(t("settings"))}</h1></div>
    <h3 class="setgrp">${esc(t("setPersonal"))}</h3>${personal}
    ${isTeam?`<h3 class="setgrp">${esc(t("setApp"))}</h3><p class="note" style="margin:-6px 0 0">${esc(t("setSub"))}</p>${!db?`<div class="card empty">${esc(t("noSave"))}</div>`:""}
    ${row("price",t("setPrice"),t("setPriceSub"))}${row("stock",t("setStock"),t("setStockSub"))}<span class="note" id="setMsg"></span>`:""}</div>`;
  $("#pLang").onclick=e=>{const b=e.target.closest("[data-x]"); if(b){ lang=b.dataset.x; try{localStorage.setItem("bt_lang",lang)}catch{} render(); }};
  $("#pTheme").onclick=e=>{const b=e.target.closest("[data-x]"); if(b){ theme=b.dataset.x; try{localStorage.setItem("bt_theme",theme)}catch{} applyTheme(); render(); }};
  if(!isTeam) return;
  ["price","stock"].forEach(k=>{ $("#set_"+k).onchange=async e=>{ const next={...SET,[k]:e.target.checked}; SET=next; try{ await db.doc("settings/app").set(next); $("#setMsg").textContent=t("saved"); }catch{ $("#setMsg").textContent=t("noSave"); } }; });
}

/* ================= GATE + START ================= */
async function sha(s){ const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
(function gate(){
  let ok=false; try{ ok=localStorage.getItem("bt_gate")===PASS_HASH; }catch{}
  if(ok||!PASS_HASH) { render(); return; }
  $("#gate").hidden=false; $("#gatePw").focus();
  $("#gateForm").onsubmit=async e=>{ e.preventDefault(); const h=await sha($("#gatePw").value.trim());
    if(h===PASS_HASH){ try{localStorage.setItem("bt_gate",h)}catch{} $("#gate").hidden=true; render(); } else { $("#gateErr").textContent=lang==="de"?"Falsches Passwort.":"Wrong password."; } };
  render();
})();
</script>
